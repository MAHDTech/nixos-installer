---
##################################################
# Name: trivy.yaml
# Description: Workflow for Trivy
##################################################

##################################################
# NOTES:
#       This workflow integrates Trivy with GitHub's code scanning feature.
#       Trivy is a simple and comprehensive vulnerability scanner from Aqua Security.
#       Visit https://github.com/aquasecurity/trivy for further information
#
##################################################

name: Trivy

# prettier-ignore
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    paths:
      - .github/workflows/trivy.yaml
      - src/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: write
  statuses: write
  security-events: write
  actions: read

env:
  # GitHub
  PROJECT: ${{ github.repository }}
  BRANCH_NAME_CURRENT: ${{ github.head_ref || github.ref_name }}
  BRANCH_NAME_DEFAULT: ${{ github.event.repository.default_branch }}

  # Nix
  NIXPKGS_ALLOW_UNFREE: 1

  # Go
  GO111MODULE: on # yamllint disable-line rule:truthy
  GOHOME: ${{ github.workspace }}

defaults:
  run:
    shell: bash

jobs:
  ##################################################
  # Run Trivy and upload results to GitHub Security.
  ##################################################

  scan:
    name: Trivy Scan

    runs-on: ${{ matrix.os }}

    timeout-minutes: 60
    continue-on-error: false

    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest

    steps:
      - id: checkout_repository
        name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive

      - id: install_nix
        name: "Install Nix ❄️"
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: true

      - id: cachix
        name: "Enable Cachix ❄️"
        uses: cachix/cachix-action@v16
        if: vars.CACHIX_CACHE_NAME != ''
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: true
          skipPush: false

      - id: devenv_install
        name: Devenv install
        run: |
          nix profile install --accept-flake-config nixpkgs#devenv

      - id: trivy_filesystem
        name: Trivy filesystem scan (SARIF)
        shell: devenv shell --quiet bash -- -e {0}
        run: >
          trivy
          filesystem
          --scanners vuln,misconfig,secret,license
          --format sarif
          --output trivy-results.sarif
          --exit-code 0
          .

      - id: trivy_upload
        name: Trivy (upload)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

      - id: trivy_status
        name: Trivy (status)
        if: always()
        shell: devenv shell --quiet bash -- -e {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ${{ steps.trivy_filesystem.outcome }} == 'success' ]];
          then
            RESULT="success"
            DESCRIPTION="Trivy security scan passed!"
          else
            RESULT="failure"
            DESCRIPTION="Trivy security scan failed!"
          fi
          gh api \
            repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -f state=${RESULT} \
            -f context="${{ github.workflow }}" \
            -f description="${DESCRIPTION}" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || {
              echo "Failed to report trivy status!"
              exit 1
            }
