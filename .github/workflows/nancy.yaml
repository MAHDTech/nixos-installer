---
##################################################
# Name: nancy.yaml
# Description: SonarType Nancy dependency scanner for Go
##################################################

name: Nancy

# prettier-ignore
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 0 * * 0"
  pull_request:
    paths:
      - .github/workflows/nancy.yaml
      - src/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: write
  statuses: write
  security-events: write
  actions: read

env:
  # GitHub
  PROJECT: ${{ github.repository }}
  BRANCH_NAME_CURRENT: ${{ github.head_ref || github.ref_name }}
  BRANCH_NAME_DEFAULT: ${{ github.event.repository.default_branch }}

  # Go
  GO111MODULE: on # yamllint disable-line rule:truthy
  GOHOME: ${{ github.workspace }}/src

defaults:
  run:
    shell: bash

jobs:
  ##################################################
  # Run Nancy and upload results to GitHub Security.
  ##################################################

  scan:
    name: Nancy Scan

    runs-on: ${{ matrix.os }}

    timeout-minutes: 60
    continue-on-error: false

    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest

    steps:
      - id: checkout_repository
        name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive

      - id: test_go_sum
        name: Test for go.sum
        shell: bash
        env:
          NANCY_GO_LIST_FILE: ${{ github.workspace }}/go.list
        run: |
          cd ${{ env.GOHOME }}
          if [ -f "go.sum" ];
          then

            echo "🔍 go.sum file present, running Nancy."
            echo "run_nancy=true" >> "$GITHUB_OUTPUT"

            # Generate the go.list file in a location that nancy can read.
            go list -json -mod=mod -m all > ${{ env.NANCY_GO_LIST_FILE }}
            jq . ${{ env.NANCY_GO_LIST_FILE }}

          else

            echo "🔍 No go.sum file present, skipping Nancy."
            echo "run_nancy=false" >> "$GITHUB_OUTPUT"

          fi

      - id: run_nancy
        name: Run Nancy
        if: ${{ steps.test_go_sum.outputs.run_nancy == 'true' }}
        uses: sonatype-nexus-community/nancy-github-action@main
        with:
          goListFile: ${{ github.workspace }}/go.list
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          nancyVersion: latest
          nancyCommand: sleuth --loud
