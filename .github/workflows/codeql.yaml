---
name: CodeQL

# prettier-ignore
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "00 0 * * 0"
  pull_request:
    paths:
      - .github/workflows/codeql.yaml
      - src/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: write
  statuses: write
  security-events: write
  actions: read

env:
  # GitHub
  PROJECT: ${{ github.repository }}
  BRANCH_NAME_CURRENT: ${{ github.head_ref || github.ref_name }}
  BRANCH_NAME_DEFAULT: ${{ github.event.repository.default_branch }}

  # Go
  GO111MODULE: on # yamllint disable-line rule:truthy
  GOHOME: ${{ github.workspace }}/src

defaults:
  run:
    shell: bash

jobs:
  #########################################################
  # Analyze
  #########################################################

  analyze:
    name: CodeQL Analyze (${{ matrix.language }})

    # yamllint disable-line rule:line-length
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}

    timeout-minutes: 60
    continue-on-error: false

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild

    steps:
      - id: checkout_repository
        name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: false
          submodules: recursive

      - id: codeql_init
        name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          source-root: ${{ env.GOHOME }}
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - id: codeql_analyze
        name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
