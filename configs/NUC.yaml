---
# Name: NUC
# Description: Intel NUC x15 Laptop with Intel ARC A730M GPU.

# Settings for NixOS
nixos:
  # The host ID to use for the installation.
  hostId: "def10001"

  # The flake to use for the installation.
  flake: github:MAHDTech/nix-config#NUC

  # The NixOS configuration partition on the uefi disk.
  config:
    enabled: true

# Settings for the UEFI partition.
uefi:
  disk: /dev/disk/by-id/usb-Samsung_Flash_Drive_FIT_0364621040007011-0:0
  label: ESP
  size: 4G

# Settings for the ZFS pools.
zfs:

  # Boot pool settings.
  boot:
    name: bpool
    compression: true
    size: 5G
    mirror: false
    stripe: false

  # Data pool settings.
  root:
    name: zpool
    compression: true
    encryption: false
    mirror: false
    stripe: false

  # ZFS disks used for the pools.
  disks:
    - /dev/disk/by-id/nvme-Corsair_MP600_PRO_NH_A5JVB427305AF2

# Settings for the swap partition.
swap:
  enabled: false
  size: 69GiB
